<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Numbers 1-20 Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #ec4899 100%);
      min-height: 100vh;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      margin: 0;
    }
    .card-bounce {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .icon-bounce {
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .btn-press:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

    <!-- HOME MENU BUTTON -->
    <div class="w-full max-w-lg mb-4">
        <a href="index.html" style="
            display: inline-block;
            padding: 10px 20px;
            background: #2d3436;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        ">🏠 Home Menu</a>
    </div>

  <!-- Main Container -->
  <div id="app" class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border-8 border-yellow-300 relative min-h-[600px] flex flex-col justify-between p-6">
    
    <!-- Top Header & Progress -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <span id="question-count" class="bg-amber-100 text-amber-900 font-bold px-4 py-1.5 rounded-full text-lg border-2 border-amber-300">
          Question 1/20
        </span>
        <button id="speaker-btn" onclick="speakCurrentQuestion()" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-950 font-bold px-4 py-2 rounded-2xl flex items-center gap-2 shadow-md btn-press border-2 border-yellow-500">
          <i class="fa-solid fa-volume-high text-xl"></i>
          <span class="text-base">Listen 🔊</span>
        </button>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-gray-200 h-4 rounded-full overflow-hidden border-2 border-gray-300 mb-4">
        <div id="progress-bar" class="bg-gradient-to-r from-yellow-400 to-emerald-400 h-full w-1/20 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Quiz Content Area -->
    <div id="quiz-screen" class="card-bounce flex-grow flex flex-col justify-between items-center text-center my-1">
      <div class="w-full">
        <!-- Big Number / Emoji Display -->
        <div id="number-badge" class="bg-amber-50 border-4 border-amber-300 rounded-3xl p-4 mb-3 shadow-inner flex flex-col items-center justify-center min-h-[140px]">
          <div id="big-number" class="text-6xl font-black text-amber-600 icon-bounce mb-1">
            5
          </div>
          <div id="emoji-counter" class="text-2xl tracking-widest break-words leading-relaxed px-2">
            🍎 🍎 🍎 🍎 🍎
          </div>
        </div>

        <!-- Question Prompt -->
        <h2 id="question-text" class="text-2xl font-extrabold text-amber-950 mb-4 px-2">
          What is the Spanish word for 5?
        </h2>

        <!-- Options Container -->
        <div id="options-container" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
          <!-- Buttons generated dynamically -->
        </div>
      </div>
    </div>

    <!-- Feedback Overlay Modal -->
    <div id="feedback-modal" class="hidden absolute inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-6 z-20">
      <div id="feedback-card" class="bg-white rounded-3xl p-6 text-center max-w-sm w-full border-4 border-yellow-400 shadow-2xl card-bounce flex flex-col items-center">
        <div id="feedback-icon" class="text-6xl mb-2">⭐</div>
        <h3 id="feedback-title" class="text-3xl font-extrabold text-gray-800 mb-2">¡Excelente!</h3>
        <p id="feedback-msg" class="text-lg text-gray-600 mb-6 leading-snug">5 in Spanish is "cinco"!</p>
        
        <button id="next-btn" onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 text-xl rounded-2xl shadow-md border-b-4 border-blue-700 btn-press">
          Next ➔
        </button>
      </div>
    </div>

    <!-- Final Results Screen -->
    <div id="results-screen" class="hidden flex-grow flex flex-col items-center justify-center text-center p-2 card-bounce">
      <div class="text-7xl mb-2">🎉</div>
      <h2 class="text-3xl font-extrabold text-amber-900 mb-1">¡Muy Bien!</h2>
      <p class="text-lg text-gray-600 mb-4">You know your Spanish Numbers 1-20!</p>
      
      <div class="bg-amber-50 rounded-2xl p-5 w-full border-2 border-amber-200 mb-6">
        <div class="text-gray-500 text-sm font-bold uppercase tracking-wider mb-1">Your Score</div>
        <div id="final-score" class="text-5xl font-black text-amber-600">20 / 20</div>
        <div id="star-rating" class="text-3xl mt-2">⭐⭐⭐⭐⭐</div>
      </div>

      <button onclick="restartQuiz()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-950 font-extrabold py-4 rounded-2xl text-2xl shadow-lg border-b-4 border-yellow-600 btn-press flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> Play Again!
      </button>
    </div>

  </div>

  <script>
    const spanishNumbers = [
      { num: 1, spanish: "uno", emoji: "🍎", options: ["uno", "dos", "tres"], explanation: "1 in Spanish is 'uno'!" },
      { num: 2, spanish: "dos", emoji: "🌟", options: ["uno", "dos", "cuatro"], explanation: "2 in Spanish is 'dos'!" },
      { num: 3, spanish: "tres", emoji: "🎈", options: ["tres", "cinco", "dos"], explanation: "3 in Spanish is 'tres'!" },
      { num: 4, spanish: "cuatro", emoji: "🐶", options: ["seis", "cuatro", "uno"], explanation: "4 in Spanish is 'cuatro'!" },
      { num: 5, spanish: "cinco", emoji: "⚽", options: ["cinco", "ocho", "tres"], explanation: "5 in Spanish is 'cinco'!" },
      { num: 6, spanish: "seis", emoji: "🚗", options: ["siete", "seis", "diez"], explanation: "6 in Spanish is 'seis'!" },
      { num: 7, spanish: "siete", emoji: "🐱", options: ["siete", "nueve", "cinco"], explanation: "7 in Spanish is 'siete'!" },
      { num: 8, spanish: "ocho", emoji: "🍕", options: ["cuatro", "ocho", "doce"], explanation: "8 in Spanish is 'ocho'!" },
      { num: 9, spanish: "nueve", emoji: "🍦", options: ["nueve", "diez", "siete"], explanation: "9 in Spanish is 'nueve'!" },
      { num: 10, spanish: "diez", emoji: "⭐", options: ["diez", "once", "veinte"], explanation: "10 in Spanish is 'diez'!" },
      { num: 11, spanish: "once", emoji: "🍪", options: ["doce", "once", "trece"], explanation: "11 in Spanish is 'once'!" },
      { num: 12, spanish: "doce", emoji: "🍌", options: ["doce", "quince", "diez"], explanation: "12 in Spanish is 'doce'!" },
      { num: 13, spanish: "trece", emoji: "🍓", options: ["catorce", "trece", "veinte"], explanation: "13 in Spanish is 'trece'!" },
      { num: 14, spanish: "catorce", emoji: "🦆", options: ["catorce", "quince", "once"], explanation: "14 in Spanish is 'catorce'!" },
      { num: 15, spanish: "quince", emoji: "🎁", options: ["dieciséis", "quince", "doce"], explanation: "15 in Spanish is 'quince'!" },
      { num: 16, spanish: "dieciséis", emoji: "🚀", options: ["diecisiete", "dieciséis", "catorce"], explanation: "16 in Spanish is 'dieciséis'!" },
      { num: 17, spanish: "diecisiete", emoji: "🎨", options: ["diecisiete", "diecinueve", "quince"], explanation: "17 in Spanish is 'diecisiete'!" },
      { num: 18, spanish: "dieciocho", emoji: "🏀", options: ["dieciocho", "veinte", "seis"], explanation: "18 in Spanish is 'dieciocho'!" },
      { num: 19, spanish: "diecinueve", emoji: "👑", options: ["diecinueve", "dieciséis", "once"], explanation: "19 in Spanish is 'diecinueve'!" },
      { num: 20, spanish: "veinte", emoji: "💎", options: ["diez", "veinte", "trece"], explanation: "20 in Spanish is 'veinte'!" }
    ];

    let questions = [];
    let currentIndex = 0;
    let score = 0;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      document.getElementById('question-count').innerText = `Question ${currentIndex + 1}/${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      
      document.getElementById('big-number').innerText = q.num;
      document.getElementById('question-text').innerText = `What is the Spanish word for ${q.num}?`;

      const count = Math.min(q.num, 10);
      document.getElementById('emoji-counter').innerText = Array(count).fill(q.emoji).join(" ") + (q.num > 10 ? ` ... (${q.num})` : "");

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const shuffledOptions = shuffleArray(q.options);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.onclick = () => handleAnswer(opt);
        btn.className = "w-full bg-amber-50 hover:bg-amber-100 text-amber-950 font-extrabold p-4 rounded-2xl text-2xl shadow-md border-4 border-amber-200 btn-press capitalize flex items-center justify-between";
        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-volume-low text-amber-400 text-lg" onclick="event.stopPropagation(); speakWord('${opt}')"></i>`;
        container.appendChild(btn);
      });

      const quizScreen = document.getElementById('quiz-screen');
      quizScreen.classList.remove('card-bounce');
      void quizScreen.offsetWidth;
      quizScreen.classList.add('card-bounce');

      setTimeout(() => speakCurrentQuestion(), 300);
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'es-ES';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakCurrentQuestion() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const q = questions[currentIndex];
        const utterance = new SpeechSynthesisUtterance(`What is the Spanish word for ${q.num}? ${q.spanish}`);
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function handleAnswer(selectedOpt) {
      window.speechSynthesis?.cancel();
      const q = questions[currentIndex];
      const isCorrect = selectedOpt === q.spanish;

      const modal = document.getElementById('feedback-modal');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const msg = document.getElementById('feedback-msg');

      if (isCorrect) {
        score++;
        icon.innerText = "⭐";
        title.innerText = "¡Excelente!";
        title.className = "text-3xl font-extrabold text-green-600 mb-2";
        msg.innerText = q.explanation;
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        playTone(523.25, 0.2);
        speakWord(q.spanish);
      } else {
        icon.innerText = "💡";
        title.innerText = "Good Try!";
        title.className = "text-3xl font-extrabold text-orange-500 mb-2";
        msg.innerText = `${q.num} in Spanish is "${q.spanish}". ${q.explanation}`;
        playTone(220.00, 0.3);
        speakWord(q.spanish);
      }

      modal.classList.remove('hidden');
    }

    function nextQuestion() {
      document.getElementById('feedback-modal').classList.add('hidden');
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('question-count').innerText = "Finished!";
      document.getElementById('speaker-btn').classList.add('hidden');
      document.getElementById('results-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${score} / ${questions.length}`;

      const stars = document.getElementById('star-rating');
      if (score === 20) stars.innerText = "⭐⭐⭐⭐⭐ Perfect Score!";
      else if (score >= 16) stars.innerText = "⭐⭐⭐⭐ ¡Muy Bien!";
      else if (score >= 10) stars.innerText = "⭐⭐⭐ Good Effort!";
      else stars.innerText = "⭐ Keep Practicing!";

      confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      questions = shuffleArray(spanishNumbers);
      document.getElementById('speaker-btn').classList.remove('hidden');
      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      loadQuestion();
    }

    function playTone(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.onload = function() {
      questions = shuffleArray(spanishNumbers);
      loadQuestion();
    };
  </script>
</body>
</html>
