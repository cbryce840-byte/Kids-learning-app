<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dillon's Learning Academy</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
        }

        p.subtitle {
            font-size: 1.2rem;
            margin: 0;
            color: #ffeaa7;
        }

        .menu-grid {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Large, colorful touch cards */
        .app-card {
            display: flex;
            align-items: center;
            padding: 20px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid white;
        }

        .app-card:active {
            transform: scale(0.95);
        }

        /* Vibrant Colors for Each App */
        .card-1 { background: linear-gradient(135deg, #ff7675, #d63031); }
        .card-2 { background: linear-gradient(135deg, #00b894, #006266); }
        .card-3 { background: linear-gradient(135deg, #fdcb6e, #e17055); }

        .card-icon {
            font-size: 3.5rem;
            margin-right: 20px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }

        .card-info h2 {
            margin: 0 0 5px 0;
            font-size: 1.6rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .card-info p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 Welcome Dillon! 🌟</h1>
        <p class="subtitle">Choose an activity to start playing:</p>
    </header>

    <div class="menu-grid">
        <!-- App 1 Link -->
        <a href="activity1.html" class="app-card card-1">
            <div class="card-icon">🎨</div>
            <div class="card-info">
                <h2>Activity 1</h2>
                <p>Tap to start learning!</p>
            </div>
        </a>

        <!-- App 2 Link -->
        <a href="activity2.html" class="app-card card-2">
            <div class="card-icon">🚀</div>
            <div class="card-info">
                <h2>Activity 2</h2>
                <p>Tap to start playing!</p>
            </div>
        </a>

        <!-- App 3 Link -->
        <a href="activity3.html" class="app-card card-3">
            <div class="card-icon">🧩</div>
            <div class="card-info">
                <h2>Activity 3</h2>
                <p>Tap to start exploring!</p>
            </div>
        </a>
                <a href="activity4.html" class="app-card card-4">
            <div class="card-icon">🦖</div>
            <div class="card-info">
                <h2>Activity 4: Prepositions</h2>
                <p>Move the characters around!</p>
            </div>
        </a>
                <a href="activity5.html" class="app-card" style="background: linear-gradient(135deg, #a855f7, #ec4899);">
            <div class="card-icon">⚖️</div>
            <div class="card-info">
                <h2>Activity 5: Comparing Sets</h2>
                <p>Which group has more or fewer?</p>
            </div>
        </a>


    </div>

</body>
</html>
